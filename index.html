<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GN Web & AI Studio — Enterprise Digital Architecture</title>
    <meta name="description" content="AI-Ready Landing Pages, GEO Optimization and 1-Year Full Technical Governance for Small & Medium Businesses.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+GO:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #060911;
            --bg-card: rgba(15, 21, 36, 0.7);
            --bg-card-hover: rgba(24, 33, 54, 0.9);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.35);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(99, 102, 241, 0.45);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fira GO', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 90% 50%, rgba(16, 185, 129, 0.1) 0%, transparent 45%);
            background-attachment: fixed;
        }

        header {
            background: rgba(6, 9, 17, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #a5b4fc, #6366f1, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }

        .lang-switcher {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 3px;
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.3rem 0.6rem;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 7px;
            transition: all 0.2s ease;
        }

        .lang-btn.active {
            background: var(--primary);
            color: white;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--primary), #4f46e5);
            color: white;
            padding: 0.85rem 1.6rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px var(--primary-glow);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.4);
        }

        .btn-emerald {
            background: linear-gradient(135deg, var(--accent), #059669);
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .btn-emerald:hover {
            box-shadow: 0 8px 30px rgba(16, 185, 129, 0.4);
        }

        .btn-glass {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            color: var(--text-main);
            box-shadow: none;
        }

        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .hero {
            padding: 5.5rem 1.5rem 3.5rem;
            text-align: center;
            max-width: 980px;
            margin: 0 auto;
        }

        .badge-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #818cf8;
            padding: 0.4rem 1.2rem;
            border-radius: 99px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 2rem;
        }

        .hero h1 {
            font-size: 3.3rem;
            line-height: 1.2;
            margin-bottom: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .hero h1 span {
            background: linear-gradient(135deg, #818cf8, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1.18rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            max-width: 750px;
            margin-left: auto;
            margin-right: auto;
            font-weight: 300;
        }

        .hero-actions {
            display: flex;
            gap: 1.2rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            max-width: 920px;
            margin: 3.5rem auto 0;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }

        .stat-item { text-align: center; }
        .stat-value { font-size: 1.85rem; font-weight: 800; color: #818cf8; }
        .stat-label { font-size: 0.85rem; color: var(--text-muted); }

        .section-header {
            text-align: center;
            margin: 5rem 0 3rem;
            padding: 0 1.5rem;
        }

        .section-header h2 { font-size: 2.3rem; font-weight: 700; margin-bottom: 0.5rem; }
        .section-header p { color: var(--text-muted); font-size: 1.05rem; }

        /* ROI Calculator Box */
        .calc-container {
            max-width: 850px;
            margin: 0 auto 4rem;
            padding: 2.5rem;
            background: linear-gradient(135deg, rgba(20, 27, 45, 0.9), rgba(10, 14, 26, 0.95));
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
        }

        .calc-slider-box {
            margin: 2rem 0;
        }

        .calc-slider {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #1e293b;
            outline: none;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .calc-result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }

        .calc-res-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 1.2rem;
            border-radius: 14px;
            border: 1px solid var(--border);
        }

        .calc-res-val {
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent);
        }

        /* Tech Spec Grid */
        .tech-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            max-width: 1150px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .tech-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 2rem;
            border-radius: 20px;
            backdrop-filter: blur(12px);
        }

        .tech-card h3 { font-size: 1.25rem; margin-bottom: 0.6rem; color: #a5b4fc; }
        .tech-card p { font-size: 0.95rem; color: var(--text-muted); }

        /* Pricing Cards */
        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
            max-width: 1050px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .price-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2.5rem;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .price-card.popular {
            border-color: var(--primary);
            box-shadow: 0 0 35px rgba(99, 102, 241, 0.25);
            background: linear-gradient(180deg, rgba(28, 37, 58, 0.95), var(--bg-card));
        }

        .price-badge {
            position: absolute;
            top: -12px;
            right: 20px;
            background: var(--primary);
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.2rem 0.8rem;
            border-radius: 99px;
        }

        .price-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.5rem; }
        .price-value { font-size: 2.6rem; font-weight: 800; color: white; margin-bottom: 0.3rem; }
        .price-subtext { font-size: 0.85rem; color: var(--accent); margin-bottom: 1.5rem; font-weight: 600; }
        .price-features { list-style: none; margin-bottom: 2rem; }
        .price-features li { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 0.8rem; display: flex; align-items: center; gap: 8px; }

        /* Showcase */
        .showcase { max-width: 1150px; margin: 4rem auto 0; padding: 0 1.5rem; }
        .showcase-card {
            background: linear-gradient(135deg, rgba(20, 27, 45, 0.85), rgba(10, 14, 26, 0.95));
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 24px;
            padding: 3.5rem 2.5rem;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 3rem;
            align-items: center;
        }

        .showcase-info h3 { font-size: 2rem; margin-bottom: 1rem; font-weight: 700; }
        .showcase-info p { color: var(--text-muted); margin-bottom: 1.5rem; font-size: 1.05rem; }

        .testimonial-quote {
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid var(--accent);
            padding: 1rem 1.2rem;
            border-radius: 0 12px 12px 0;
            font-size: 0.92rem;
            color: var(--text-main);
            margin-bottom: 1.5rem;
            font-style: italic;
        }

        .pill-group { display: flex; gap: 0.8rem; flex-wrap: wrap; margin-bottom: 2rem; }
        .pill { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); padding: 0.4rem 0.9rem; border-radius: 8px; font-size: 0.85rem; color: #a5b4fc; }

        .visual-preview {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem;
            text-align: center;
        }

        /* Floating WhatsApp Button */
        .floating-wa {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: var(--accent);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
            text-decoration: none;
            z-index: 9999;
            transition: transform 0.3s ease;
        }

        .floating-wa:hover { transform: scale(1.1); }

        .contact-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2.5rem;
            max-width: 600px;
            margin: 2rem auto 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            text-align: left;
        }

        .contact-item { display: flex; align-items: center; gap: 1rem; font-size: 1.1rem; color: var(--text-main); text-decoration: none; }
        .contact-item:hover { color: #818cf8; }

        .footer-cta {
            text-align: center;
            padding: 6rem 1.5rem;
            background: radial-gradient(circle at 50% 100%, rgba(99, 102, 241, 0.15) 0%, transparent 60%);
            border-top: 1px solid var(--border);
            margin-top: 4rem;
        }

        footer { text-align: center; padding: 2.5rem; color: var(--text-muted); font-size: 0.88rem; border-top: 1px solid var(--border); background: #04060b; }

        @media (max-width: 850px) {
            .hero h1 { font-size: 2.2rem; }
            .showcase-card { grid-template-columns: 1fr; text-align: center; padding: 2rem 1.5rem; }
            .stats-bar { flex-direction: column; gap: 1.5rem; }
            .calc-result-grid { grid-template-columns: 1fr; }
            header { flex-direction: column; gap: 1rem; }
        }
    </style>
</head>
